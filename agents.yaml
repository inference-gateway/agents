# Source list for the agents catalog served at:
#   https://cdn.jsdelivr.net/gh/inference-gateway/agents@main/catalog.json
#
# Each entry must point at a public GitHub repo that ships an ADL agent.yaml
# at its root. The build job fetches that agent.yaml, validates it against the
# ADL JSON Schema, and bundles all of them into catalog.json.
#
#   url  (required)  - full https://github.com/<owner>/<repo> URL
#   ref  (optional)  - branch, tag, or commit SHA (default: main).
#                      Pinning a release tag is recommended for third-party
#                      agents so upstream changes can't break the catalog.
#
# Third-party agents are welcome. Open a PR adding one entry.

agents:
  - url: https://github.com/inference-gateway/mock-agent
    ref: v0.3.3
  - url: https://github.com/inference-gateway/browser-agent
    ref: v0.6.4
  - url: https://github.com/inference-gateway/documentation-agent
    ref: v0.3.0
  - url: https://github.com/inference-gateway/google-calendar-agent
    ref: v0.5.0
  - url: https://github.com/inference-gateway/n8n-agent
    ref: v0.3.0
  - url: https://github.com/inference-gateway/grafana-agent
    ref: v0.3.0
