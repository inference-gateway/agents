---
name: Build catalog

on:
  push:
    branches:
      - main
    paths:
      - 'agents.yaml'
      - 'scripts/build-catalog.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-catalog.yml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_ID }}
          private-key: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Create or update pull request with catalog changes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! git diff --quiet -- catalog.json; then
            git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
            git config user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

            # Check if there's already an open catalog PR
            EXISTING_PR=$(gh pr list \
              --state open \
              --head 'catalog/' \
              --json headRefName,number \
              --jq '.[0] // empty' \
              --limit 1)

            if [ -n "$EXISTING_PR" ]; then
              BRANCH=$(echo "$EXISTING_PR" | jq -r '.headRefName')
              PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.number')
              echo "Updating existing PR #$PR_NUMBER on branch $BRANCH"

              git checkout "$BRANCH"
              git add catalog.json
              git commit -m "chore(catalog): Rebuild catalog.json [skip ci]"
              git push --force origin "$BRANCH"

              gh pr comment "$PR_NUMBER" --body "Updated catalog.json with latest upstream manifests."
            else
              BRANCH="catalog/update-$(date +%Y%m%d%H%M%S)"
              echo "Creating new PR on branch $BRANCH"

              git checkout -b "$BRANCH"
              git add catalog.json
              git commit -m "chore(catalog): Rebuild catalog.json [skip ci]"
              git push origin "$BRANCH"

              gh pr create \
                --title "chore(catalog): Rebuild catalog.json" \
                --body "Automated catalog rebuild from upstream agent manifests." \
                --base main \
                --head "$BRANCH"
            fi
          else
            echo "No catalog changes to commit."
          fi
