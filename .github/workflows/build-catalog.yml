---
name: Build catalog

on:
  push:
    branches:
      - main
    paths:
      - 'agents.yaml'
      - 'scripts/build-catalog.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Create or update pull request with catalog changes
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore(catalog): Rebuild catalog.json [skip ci]'
          branch: catalog/update
          title: 'chore(catalog): rebuild catalog.json'
          body: |
            Automated catalog rebuild from upstream agent manifests.
          add-paths: catalog.json
          base: main
